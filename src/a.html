<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mochileros por el mundo</title>
        <link rel="icon" type="image/x-icon" href="images/mochilachati.png">
        <link rel="stylesheet" type="text/css" href="styles/styles.css">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter">
    </head>

    <body class="body-registro">
        <header>
            <div class="nombre-sitio">Mochileros por el mundo</div>
            <input type="checkbox" id="menu-toggle">
    
            <label for="menu-toggle" class="icono-hamburger">
                 <span class="sr-only">Menú de navegación</span>
                 <span class="raya"></span>
                 <span class="raya"></span>
                 <span class="raya"></span>
            </label>
            
            <nav class="menu-principal">
                <a href="home.html">Inicio</a>
                <a href="comunidad.html">Comunidad</a>
                <a href="otros_rincones.html">Otros Rincones</a>
                
            </nav>
            
            <div class="derecha">
                <img src="images/mochilachati.png" alt="Logo" width="60"
                    height="60">
                <form class="idioma-form">
                    <label for="idioma">Idioma</label>
                    <select id="idioma" name="idioma">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                    </select>
                </form>
            </div>
        </header>
        <div class="contenedor-registro">
            <h2>Registro de nuevos usuarios</h2>
            <form class="formulario-registro" id="formulario-registro" action="b.html" autocomplete="off">
                <input type="text" id="nombre_registro" placeholder="Nombre*"
                    pattern="^[A-Za-z]{3,}$"
                    title="Debe tener al menos 3 caracteres." required>

                <input type="text" id="apellidos_registro"
                    placeholder="Apellidos*"
                    pattern="^([A-Za-z]{3,})\s+([A-Za-z]{3,})$"
                    title="Debe tener al menos dos palabras de 3 caracteres cada una."
                    required>

                <input type="text" id="correo_registro"
                    placeholder="Correo electrónico*"
                    pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
                    title="Correo no válido. Ejemplo: usuario@dominio.extensión"
                    required>

                <input type="text" id="confirmar_correo_registro"
                    placeholder="Confirmar correo*"
                    pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
                    title="Correo no válido. Ejemplo: usuario@dominio.extensión"
                    required>

                <label for="fecha_registro" class="sr-only">Fecha de nacimiento</label>
                <input type="date" id="fecha_registro" class="full-width" required>

                <input type="text" id="usuario_registro"
                    pattern="^[A-Za-z]{5,}$"
                    title="Debe tener al menos 5 caracteres."
                    placeholder="Usuario*"
                    required>

                <input type="password" id="contraseña_registro"
                    pattern="^(?=(.*\d){2})(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z\d ]).{8,}$"
                    title="La contraseña debe tener al menos 8 caracteres, con mínimo 2 números, 1 mayúscula, 1 minúscula y 1 carácter especial."
                    placeholder="Contraseña*" required>

                <label for="foto_registro" class="sr-only">Foto de perfil</label>
                <input type="file" id="foto_registro" class="full-width"
                    accept="image/jpeg, image/png, image/webp" required>

                <label class="politica-privacidad">
                    <input id="politica" type="checkbox" required> Acepto la <a
                        href="#">Política de privacidad</a>
                </label>

                <button id="guardar_datos" type="submit" disabled>Guardar datos
                    y
                    acceder</button>
            </form>

        </div>

        <footer>
            <div class="footer-copy">
                &copy; 2025 Mochileros por el mundo. Todos los derechos
                reservados.
            </div>
            <div class="footer-enlaces">
                <a href="#">Sobre nosotros</a>
                <a href="#">Política de privacidad</a>
                <a href="#">Ayuda</a>
                <a href="#">Contacto</a>
            </div>
            <div class="footer-redes">
                <a href="#" title="Instagram" aria-label="Instagram">
                    <img src="images/instagram.svg" alt="Instagram"
                        class="icono-red">
                </a>
                <a href="#" title="TikTok" aria-label="TikTok">
                    <img src="images/tiktok.svg" alt="Tiktok" class="icono-red">
                </a>
                <a href="#" title="YouTube" aria-label="YouTube">
                    <img src="images/youtube.svg" alt="Youtube"
                        class="icono-red">
                </a>
            </div>
            <form class="footer-newsletter" action="#" method="post">
                <label for="newsletter-email" class="suscribete">Suscríbete a la
                    newsletter</label>
                <input type="email" id="newsletter-email" name="email"
                    placeholder="Tu email" required>
                <button type="submit">Suscribirse</button>
            </form>
        </footer>
        <div id="errorModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <p></p>
            </div>
        </div>
        <script src="script/script.js"></script>
    </body>
</html>
